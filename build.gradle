plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
}

version = "1.0.0"
group = "com.killaura"

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.4"
    mappings "net.fabricmc:yarn:1.20.4+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
}
